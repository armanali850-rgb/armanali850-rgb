<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" width="480" height="360" role="img" aria-label="Animated illustration: an AI model scanning a chest X-ray and predicting the diagnosis">
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0E1533"/>
      <stop offset="1" stop-color="#090D1F"/>
    </linearGradient>
    <radialGradient id="film" cx="0.5" cy="0.45" r="0.65">
      <stop offset="0" stop-color="#1B2440"/>
      <stop offset="1" stop-color="#03050C"/>
    </radialGradient>
    <radialGradient id="lung" cx="0.5" cy="0.45" r="0.6">
      <stop offset="0" stop-color="#94A3B8" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#CBD5E1" stop-opacity="0.22"/>
    </radialGradient>
    <linearGradient id="spine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E2E8F0" stop-opacity="0.15"/>
      <stop offset="0.5" stop-color="#E2E8F0" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#E2E8F0" stop-opacity="0.15"/>
    </linearGradient>
    <radialGradient id="heat" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FF2E63" stop-opacity="0.95"/>
      <stop offset="0.35" stop-color="#FB923C" stop-opacity="0.7"/>
      <stop offset="0.7" stop-color="#FACC15" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0.35"/>
    </linearGradient>
    <linearGradient id="barP" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#F472B6"/>
    </linearGradient>
    <clipPath id="filmClip"><rect x="20" y="52" width="230" height="290" rx="8"/></clipPath>
  </defs>

  <style>
    .sans { font-family: 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; }
    .mono { font-family: 'JetBrains Mono', Consolas, Menlo, 'Courier New', monospace; }
    .blink { animation: blink 1s steps(1) infinite; }
    .live { animation: live 1.4s ease-in-out infinite; }
    @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0; } }
    @keyframes live { 0%, 100% { opacity: 1; } 50% { opacity: .25; } }
  </style>

  <!-- window -->
  <rect x="1" y="1" width="478" height="358" rx="14" fill="url(#panel)" stroke="#22D3EE" stroke-opacity="0.35"/>
  <circle cx="22" cy="24" r="5" fill="#FF5F57"/>
  <circle cx="38" cy="24" r="5" fill="#FEBC2E"/>
  <circle cx="54" cy="24" r="5" fill="#28C840"/>
  <text x="240" y="28" text-anchor="middle" class="mono" font-size="11.5" fill="#94A3B8">xrayinsight-ai — live inference</text>
  <circle class="live" cx="424" cy="24" r="4" fill="#FF2E63"/>
  <text x="433" y="28" class="mono" font-size="10.5" font-weight="700" fill="#FF2E63">LIVE</text>
  <line x1="1" y1="42" x2="479" y2="42" stroke="#22D3EE" stroke-opacity="0.15"/>

  <!-- X-ray film -->
  <g clip-path="url(#filmClip)">
    <rect x="20" y="52" width="230" height="290" fill="url(#film)"/>

    <!-- lungs -->
    <path d="M122 96C95 88 62 112 54 172C48 232 60 292 86 304C106 310 120 298 122 282Z" fill="url(#lung)"/>
    <path d="M148 96C175 88 208 112 216 172C222 232 210 292 184 304C164 310 150 298 148 282Z" fill="url(#lung)"/>
    <ellipse cx="152" cy="250" rx="30" ry="38" fill="#CBD5E1" fill-opacity="0.10"/>

    <!-- spine -->
    <rect x="129" y="62" width="12" height="282" rx="4" fill="url(#spine)"/>
    <g stroke="#0B1021" stroke-opacity="0.6" stroke-width="1.5">
      <path d="M129 90H141M129 112H141M129 134H141M129 156H141M129 178H141M129 200H141M129 222H141M129 244H141M129 266H141M129 288H141M129 310H141"/>
    </g>

    <!-- clavicles & ribs -->
    <g fill="none" stroke="#E2E8F0" stroke-opacity="0.55" stroke-width="3" stroke-linecap="round">
      <path d="M128 84C106 72 82 74 60 86"/>
      <path d="M142 84C164 72 188 74 210 86"/>
    </g>
    <g fill="none" stroke="#E2E8F0" stroke-opacity="0.42" stroke-width="2.6" stroke-linecap="round">
      <path d="M128 100C104 92 70 100 58 128"/>
      <path d="M142 100C166 92 200 100 212 128"/>
      <path d="M128 122C100 114 64 124 52 154"/>
      <path d="M142 122C170 114 206 124 218 154"/>
      <path d="M128 145C98 137 62 148 50 180"/>
      <path d="M142 145C172 137 208 148 220 180"/>
      <path d="M128 168C98 160 62 172 50 206"/>
      <path d="M142 168C172 160 208 172 220 206"/>
      <path d="M128 191C98 184 64 196 53 230"/>
      <path d="M142 191C172 184 206 196 217 230"/>
      <path d="M128 214C100 208 68 220 59 252"/>
      <path d="M142 214C170 208 202 220 211 252"/>
      <path d="M128 237C104 232 76 244 69 272"/>
      <path d="M142 237C166 232 194 244 201 272"/>
    </g>

    <!-- Grad-CAM heatmap -->
    <circle cx="88" cy="214" r="40" fill="url(#heat)" opacity="0.85">
      <animate attributeName="opacity" values="0;0;0.9;0.65;0.9;0" keyTimes="0;0.3;0.42;0.6;0.85;1" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="r" values="30;30;42;36;42;30" keyTimes="0;0.3;0.42;0.6;0.85;1" dur="6s" repeatCount="indefinite"/>
    </circle>

    <!-- region of interest box -->
    <g fill="none" stroke="#F472B6" stroke-width="2">
      <path d="M56 182v-10h10M110 172h10v10M120 246v10h-10M66 256h-10v-10"/>
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.4;0.45;0.92;1" dur="6s" repeatCount="indefinite"/>
    </g>
    <g>
      <rect x="56" y="158" width="42" height="14" rx="3" fill="#F472B6"/>
      <text x="77" y="168.5" text-anchor="middle" class="mono" font-size="9" font-weight="700" fill="#0B1021">ROI</text>
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.4;0.45;0.92;1" dur="6s" repeatCount="indefinite"/>
    </g>

    <!-- scanning beam -->
    <g>
      <rect x="20" y="22" width="230" height="30" fill="url(#beam)"/>
      <rect x="20" y="51" width="230" height="2" fill="#67E8F9"/>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 292;0 292" keyTimes="0;0.5;1" dur="6s" repeatCount="indefinite"/>
    </g>

    <text x="28" y="334" class="mono" font-size="9.5" fill="#64748B">PA VIEW · 224×224</text>
  </g>
  <rect x="20" y="52" width="230" height="290" rx="8" fill="none" stroke="#22D3EE" stroke-opacity="0.3"/>

  <!-- prediction panel -->
  <text x="268" y="70" class="mono" font-size="11" letter-spacing="2" fill="#22D3EE">PREDICTION</text>

  <text x="268" y="98" class="sans" font-size="12.5" fill="#E2E8F0">Pneumonia</text>
  <text x="460" y="98" text-anchor="end" class="mono" font-size="12" font-weight="700" fill="#F472B6">94.2%</text>
  <rect x="268" y="105" width="192" height="8" rx="4" fill="#1E293B"/>
  <rect x="268" y="105" width="181" height="8" rx="4" fill="url(#barP)">
    <animate attributeName="width" values="0;0;181;181;0" keyTimes="0;0.3;0.5;0.92;1" dur="6s" repeatCount="indefinite"/>
  </rect>

  <text x="268" y="134" class="sans" font-size="12.5" fill="#E2E8F0">Normal</text>
  <text x="460" y="134" text-anchor="end" class="mono" font-size="12" fill="#34D399">4.6%</text>
  <rect x="268" y="141" width="192" height="8" rx="4" fill="#1E293B"/>
  <rect x="268" y="141" width="9" height="8" rx="4" fill="#34D399">
    <animate attributeName="width" values="0;0;9;9;0" keyTimes="0;0.3;0.5;0.92;1" dur="6s" repeatCount="indefinite"/>
  </rect>

  <text x="268" y="170" class="sans" font-size="12.5" fill="#E2E8F0">COVID-19</text>
  <text x="460" y="170" text-anchor="end" class="mono" font-size="12" fill="#FBBF24">1.2%</text>
  <rect x="268" y="177" width="192" height="8" rx="4" fill="#1E293B"/>
  <rect x="268" y="177" width="4" height="8" rx="4" fill="#FBBF24">
    <animate attributeName="width" values="0;0;4;4;0" keyTimes="0;0.3;0.5;0.92;1" dur="6s" repeatCount="indefinite"/>
  </rect>

  <!-- model chips -->
  <rect x="268" y="198" width="92" height="20" rx="10" fill="none" stroke="#A78BFA" stroke-opacity="0.7"/>
  <text x="314" y="212" text-anchor="middle" class="mono" font-size="10" fill="#C4B5FD">DenseNet-121</text>
  <rect x="368" y="198" width="92" height="20" rx="10" fill="none" stroke="#22D3EE" stroke-opacity="0.7"/>
  <text x="414" y="212" text-anchor="middle" class="mono" font-size="10" fill="#67E8F9">Grad-CAM</text>

  <!-- terminal -->
  <rect x="268" y="230" width="192" height="112" rx="8" fill="#04060E" stroke="#334155"/>
  <g class="mono" font-size="10.5">
    <text x="278" y="252" fill="#CBD5E1"><tspan fill="#22D3EE">$</tspan> python predict.py chest.png
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.04;0.05;0.94;1" dur="6s" repeatCount="indefinite"/>
    </text>
    <text x="278" y="272" fill="#94A3B8">› loading densenet121.pt ✓
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.16;0.17;0.94;1" dur="6s" repeatCount="indefinite"/>
    </text>
    <text x="278" y="292" fill="#94A3B8">› running inference…
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.28;0.29;0.94;1" dur="6s" repeatCount="indefinite"/>
    </text>
    <text x="278" y="312" fill="#F472B6">› PNEUMONIA (94.2%)
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.5;0.51;0.94;1" dur="6s" repeatCount="indefinite"/>
    </text>
    <text x="278" y="332" fill="#34D399">› gradcam.png saved ✓<tspan class="blink" fill="#22D3EE"> ▌</tspan>
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.62;0.63;0.94;1" dur="6s" repeatCount="indefinite"/>
    </text>
  </g>
</svg>
