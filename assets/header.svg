<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="1200" height="280" role="img" aria-label="Arman Ali — AI/ML Engineer and Full-Stack Developer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070B1A"/>
      <stop offset="0.55" stop-color="#0E1533"/>
      <stop offset="1" stop-color="#1A0F33"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#67E8F9"/>
      <stop offset="0.5" stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#F472B6"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0"/>
      <stop offset="0.85" stop-color="#22D3EE" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="0.5" stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#F472B6"/>
    </linearGradient>
    <radialGradient id="glowC" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowV" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#A855F7" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#A855F7" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#22D3EE" stroke-opacity="0.07"/>
    </pattern>
    <clipPath id="frame"><rect width="1200" height="280" rx="20"/></clipPath>
  </defs>

  <style>
    .sans { font-family: 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; }
    .mono { font-family: 'JetBrains Mono', Consolas, Menlo, 'Courier New', monospace; }
    .node { animation: pulse 2.4s ease-in-out infinite; }
    .link { animation: flicker 3.2s ease-in-out infinite; }
    .blink { animation: blink 1s steps(1) infinite; }
    .rise { animation: rise 1s ease-out both; }
    @keyframes pulse { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }
    @keyframes flicker { 0%, 100% { stroke-opacity: .10; } 50% { stroke-opacity: .32; } }
    @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0; } }
    @keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
  </style>

  <g clip-path="url(#frame)">
    <rect width="1200" height="280" fill="url(#bg)"/>
    <rect width="1200" height="280" fill="url(#grid)"/>
    <circle cx="180" cy="60" r="260" fill="url(#glowC)"/>
    <circle cx="1000" cy="160" r="300" fill="url(#glowV)"/>

    <!-- neural network -->
    <g stroke="#22D3EE" stroke-width="1.2" fill="none">
      <g class="link">
        <path d="M850 80L950 60M850 80L950 113M850 80L950 166M850 80L950 220"/>
        <path d="M850 140L950 60M850 140L950 113M850 140L950 166M850 140L950 220"/>
        <path d="M850 200L950 60M850 200L950 113M850 200L950 166M850 200L950 220"/>
      </g>
      <g class="link" style="animation-delay:.8s">
        <path d="M950 60L1050 90M950 60L1050 140M950 60L1050 190"/>
        <path d="M950 113L1050 90M950 113L1050 140M950 113L1050 190"/>
        <path d="M950 166L1050 90M950 166L1050 140M950 166L1050 190"/>
        <path d="M950 220L1050 90M950 220L1050 140M950 220L1050 190"/>
      </g>
      <g class="link" style="animation-delay:1.6s">
        <path d="M1050 90L1130 140M1050 140L1130 140M1050 190L1130 140"/>
      </g>
    </g>

    <g stroke-width="2.5" fill="#0B1021">
      <circle class="node" cx="850" cy="80" r="8" stroke="#22D3EE"/>
      <circle class="node" cx="850" cy="140" r="8" stroke="#22D3EE" style="animation-delay:.3s"/>
      <circle class="node" cx="850" cy="200" r="8" stroke="#22D3EE" style="animation-delay:.6s"/>
      <circle class="node" cx="950" cy="60" r="8" stroke="#A78BFA" style="animation-delay:.2s"/>
      <circle class="node" cx="950" cy="113" r="8" stroke="#A78BFA" style="animation-delay:.5s"/>
      <circle class="node" cx="950" cy="166" r="8" stroke="#A78BFA" style="animation-delay:.8s"/>
      <circle class="node" cx="950" cy="220" r="8" stroke="#A78BFA" style="animation-delay:1.1s"/>
      <circle class="node" cx="1050" cy="90" r="8" stroke="#C084FC" style="animation-delay:.4s"/>
      <circle class="node" cx="1050" cy="140" r="8" stroke="#C084FC" style="animation-delay:.7s"/>
      <circle class="node" cx="1050" cy="190" r="8" stroke="#C084FC" style="animation-delay:1s"/>
      <circle cx="1130" cy="140" r="12" stroke="#F472B6"/>
    </g>
    <circle cx="1130" cy="140" r="5" fill="#F472B6">
      <animate attributeName="r" values="4;7;4" dur="1.6s" repeatCount="indefinite"/>
    </circle>

    <!-- signals travelling through the network -->
    <circle r="3.5" fill="#67E8F9">
      <animateMotion dur="2.8s" repeatCount="indefinite" path="M850 80L950 166L1050 140L1130 140"/>
    </circle>
    <circle r="3.5" fill="#C4B5FD">
      <animateMotion dur="2.8s" begin="0.9s" repeatCount="indefinite" path="M850 200L950 60L1050 90L1130 140"/>
    </circle>
    <circle r="3.5" fill="#F9A8D4">
      <animateMotion dur="2.8s" begin="1.8s" repeatCount="indefinite" path="M850 140L950 220L1050 190L1130 140"/>
    </circle>

    <!-- scanning beam -->
    <rect x="-140" y="0" width="140" height="280" fill="url(#scan)">
      <animate attributeName="x" values="-140;1200" dur="6s" repeatCount="indefinite"/>
    </rect>

    <!-- text -->
    <g class="rise">
      <text x="72" y="92" class="mono" font-size="16" letter-spacing="5" fill="#22D3EE">HI THERE, I'M</text>
      <text x="66" y="160" class="sans" font-size="70" font-weight="800" fill="url(#name)">Arman Ali</text>
      <text x="72" y="200" class="sans" font-size="19" fill="#CBD5E1">AI/ML Engineer  ·  Full-Stack Developer  ·  LLM &amp; Agentic AI  ·  Android</text>
      <text x="72" y="240" class="mono" font-size="15" fill="#94A3B8"><tspan fill="#F472B6">&gt;</tspan> building intelligent systems that see, reason &amp; ship<tspan class="blink" fill="#22D3EE"> ▌</tspan></text>
    </g>

    <rect y="276" width="1200" height="4" fill="url(#edge)"/>
  </g>
</svg>
